name: Release addon

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package addon
        run: |
          mkdir -p package/PVPTabTarget
          rsync -a --exclude='.git' --exclude='.github' ./ package/PVPTabTarget/
          cd package
          zip -r ../PVPTabTarget-${{ github.ref_name }}.zip PVPTabTarget
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: PVPTabTarget-${{ github.ref_name }}.zip
